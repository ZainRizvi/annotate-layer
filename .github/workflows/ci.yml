name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pr-title:
    # Squash merges use the PR title as the commit message, and the publish workflow picks the
    # semver bump from it, so it must be a conventional commit header.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|perf|docs|ci|test|refactor|build|chore|style|revert)(\([^)]+\))?!?: .+'; then
            echo "::error::PR title must start with a conventional type, such as 'feat: …', 'fix(client): …' or 'feat!: …' for a breaking change."
            exit 1
          fi

  layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  fastapi-reference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/fastapi
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
