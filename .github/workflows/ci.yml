name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pr-title:
    # Squash merges use the PR title as the commit message, and the publish workflow picks the
    # release from it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/release-type.ts --check-title "$TITLE"

  layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  fastapi-reference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/fastapi
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
