[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "annotate-github-fastapi"
version = "0.1.0"
description = "FastAPI backend for annotate-layer that stores each note as a GitHub issue via a GitHub App."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.100",
  "pydantic>=2",
  "httpx",
  "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "cryptography",
]

[tool.hatch.build.targets.wheel]
packages = ["annotate_github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# FastAPI declares dependencies as argument defaults.
ignore = ["B008"]
